name: Dependabot Auto Merge

# Dependabot の PR を、CI（ci.yml）が通過した時点でこのワークフロー自身がマージする。
# GitHub ネイティブの auto-merge・ブランチ保護・PAT は不要。
#
#   1. label-major: PR 作成時に semver-major・Terraform・major 判定できない直接依存なら `needs-review` を付ける（自動マージ対象外）
#   2. merge:       CI 成功（workflow_run）を受けて PR をマージし、deploy.yml を起動する
#
# GITHUB_TOKEN によるマージでは develop への push イベントで deploy.yml が起動しないため、
# マージ後に workflow_dispatch で明示的にデプロイを起動する（workflow_dispatch は GITHUB_TOKEN でも起動可能）。
#
# CI が失敗した場合はマージされず、dependabot-ci-autofix.yml が修正コミットを試みる。
# 修正 push で CI が再実行され、成功すれば本ワークフローがマージする。

on:
  pull_request:
    # synchronize も対象にし、既存 PR を `@dependabot rebase` した場合にも major 判定を行う
    types: [opened, reopened, synchronize]
    branches:
      - develop
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]

env:
  # semver-major も自動マージする場合は 'true' にする。
  # develop へのマージ = 本番自動デプロイであり、自動テストも未導入のため既定では手動レビューとする。
  ALLOW_MAJOR: 'false'

jobs:
  label-major:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 自動マージ対象外（needs-review）にする条件。いずれかの依存が該当すれば対象外:
      #   - semver-major（ALLOW_MAJOR=true なら許可）
      #   - Terraform: requirement 更新（例: ~> 7.0 → ~> 8.8）は update-type が付かず major 判定できないため常に
      #   - update-type なしの直接依存: セキュリティアップデートは update-type が付かないため、
      #     バージョンから major 判定する（判定できなければ安全側で対象外）
      - name: Label major / terraform update for manual review
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          # メタデータが取れなければ判定できないので安全側で対象外
          if [ -z "$DEPS_JSON" ] || [ "$DEPS_JSON" = "[]" ]; then DEPS_JSON='[{"dependencyName":"(unknown)","dependencyType":"direct"}]'; fi
          reasons=$(jq -r --arg allow_major "$ALLOW_MAJOR" '
            # major 相当の番号（0.x は minor が破壊的変更の単位）
            def major_key: (sub("^[^0-9]*"; "") | split(".")) as $p
              | if ($p[0] // "") == "0" then "0." + ($p[1] // "") else ($p[0] // "") end;
            .[] |
            if .packageEcosystem == "terraform" then "\(.dependencyName): terraform"
            elif .updateType == "version-update:semver-major" then
              (if $allow_major == "true" then empty else "\(.dependencyName): semver-major" end)
            elif ((.updateType // "") == "") and ((.dependencyType // "") | startswith("direct")) then
              (if ((.prevVersion // "") == "") or ((.newVersion // "") == "") then "\(.dependencyName): バージョン不明の直接依存"
               elif (.prevVersion | major_key) != (.newVersion | major_key) then "\(.dependencyName): \(.prevVersion) → \(.newVersion)"
               else empty end)
            else empty end
          ' <<<"$DEPS_JSON")
          if [ -z "$reasons" ]; then
            echo "自動マージ対象"
            exit 0
          fi
          echo "手動レビュー対象:"; echo "$reasons"
          gh label create needs-review --repo "$GITHUB_REPOSITORY" --color d93f0b --description "人手のレビューが必要" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label needs-review

  merge:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] &&
      github.event.workflow_run.pull_requests[0].base.ref == 'develop' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # deploy.yml の workflow_dispatch に必要
    concurrency:
      group: dependabot-merge
      cancel-in-progress: false
    steps:
      - name: Merge PR
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,author,labels,mergeable)
          state=$(jq -r '.state' <<<"$pr")
          author=$(jq -r '.author.login' <<<"$pr")
          case "$author" in
            app/dependabot|dependabot\[bot\]) is_dependabot=true ;;
            *) is_dependabot=false ;;
          esac
          if [ "$state" != "OPEN" ] || [ "$is_dependabot" != "true" ]; then
            echo "skip: state=$state author=$author"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if jq -e '.labels[] | select(.name == "needs-review")' <<<"$pr" >/dev/null; then
            echo "skip: needs-review ラベル付き"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # コンフリクトは Dependabot が自動でリベースする → CI 再実行 → 再度このジョブが走るため見送るだけにする
          if [ "$(jq -r '.mergeable' <<<"$pr")" = "CONFLICTING" ]; then
            echo "skip: develop とコンフリクトしているため Dependabot のリベースを待つ"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --match-head-commit: CI を通過したコミットから HEAD が進んでいたらマージしない
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            # 例: .github/workflows を変更する PR は GITHUB_TOKEN ではマージできない / ブランチ保護の条件を満たさない
            gh label create needs-review --repo "$GITHUB_REPOSITORY" --color d93f0b --description "人手のレビューが必要" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label needs-review
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "CI は通過しましたが自動マージに失敗しました（ワークフローファイルの変更・ブランチ保護の条件未達等）。手動でマージしてください。"
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref develop
